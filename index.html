<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="description"
      content="Rosemary Beauty Empire — premium beauty products and exceptional beauty services designed to make you feel confident, beautiful, and unforgettable."
    />

    <meta
      name="theme-color"
      content="#050505"
    />

    <meta
      name="application-name"
      content="Rosemary Beauty Empire"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- PWA -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- Apple / iOS -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="RBE"
    />

    <link
      rel="apple-touch-icon"
      href="/icons/icon-192.png"
    />

    <!-- Microsoft / Windows -->
    <meta
      name="msapplication-TileColor"
      content="#050505"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"

    <!-- Title -->
    <title>Rosemary Beauty Empire</title>

  <body>

    <script
